# Keep Who Serves' officeholders current without an App Store release.
#
# Every Monday this re-reads the same three public sources the app's bundled
# list comes from (the Senate's contact list, the House Clerk's member data,
# Open States' per-state legislator files) and publishes the result at
# https://carrierpress.com/whoserves/data/officeholders.json. The app fetches
# that file at launch, accepts it only if it is newer and well-formed, and
# keeps its bundled list otherwise (HomeRule lib/live.ts). A reader never sees
# a spinner, an update prompt or a changed screen they did not ask for; the
# next lookup simply has the new name.
#
# THE SCRIPT IS A VERBATIM COPY of HomeRule's scripts/build-officeholders.py,
# at vendor/whoserves/, because that repo is private and this workflow cannot
# read it. HomeRule's `npm run check:vendor` says whether the two still match.
#
# ⛔ A REFUSAL IS A FAILED RUN, ON PURPOSE. The script exits non-zero instead of
# publishing when the seat count drops by more than 5% or more than 10% of seats
# change hands at once against the file already published. That is what a
# partial upstream outage looks like, and publishing it would tell every reader
# their legislators had resigned. GitHub emails the repository owner about a
# failed scheduled run, which is the alert. Re-run by hand once the source is
# healthy, or run it manually with a reviewed exception.
#
# Nothing is published when nothing changed: no commit, no deploy.
#
# ON THE RECORD (2026-10-18): the same run also rebuilds the voting record at
# whoserves/data/record.json from vendor/whoserves/build-record.py (also a
# verbatim copy of HomeRule's scripts/). Roll calls come from the House Clerk
# and the Senate; the House floor video link is the Clerk's HouseLive by date.
# Committee video comes from the congress.gov API and needs the repository
# secret CONGRESS_API_KEY (free, from api.congress.gov/sign-up). Without the
# secret the record still builds, just without committee video. The meeting
# cache in vendor/whoserves/cache/ is committed so a weekly run asks congress.gov
# only about meetings that changed. Links only: no video is ever stored here.
#
# CONGRESS.GOV STATUS (2026-10-19): with the same key, the record also carries
# each voted bill's or nomination's Congress.gov title, its latest action
# (verbatim, dated) and whether a CRS summary exists. One request per measure,
# about 50 a week. HomeRule docs/congress-gov-api.md.
#
# ⚠️ homerule/data/ is a COPY kept for builds up to 19, which still fetch the
# old path. Keep writing it until no build in use reads homerule/data/.
name: whoserves-officeholders

on:
  schedule:
    - cron: "17 10 * * 1"   # Mondays 10:17 UTC, off the hour to avoid the rush
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: whoserves-officeholders
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild the list from the public sources
        run: |
          python3 vendor/whoserves/build-officeholders.py --json whoserves/data/officeholders.json
          cp whoserves/data/officeholders.json homerule/data/officeholders.json

      - name: Rebuild the voting record and its official recording links
        env:
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
        run: |
          python3 vendor/whoserves/build-record.py --json whoserves/data/record.json --cache vendor/whoserves/cache/committee-meetings.json

      - name: Publish if anything changed
        run: |
          git add -N vendor/whoserves/cache/ whoserves/data/record.json
          if git diff --quiet -- whoserves/data/officeholders.json whoserves/data/record.json vendor/whoserves/cache/; then
            echo "No change since the last published copy."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add whoserves/data/officeholders.json homerule/data/officeholders.json whoserves/data/record.json vendor/whoserves/cache/
          git commit -m "Who Serves officeholders and record: weekly refresh $(date -u +%F)"
          # The record build takes about 25 minutes, long enough for another
          # push to land on main. Replay this data commit on top before pushing.
          git pull --rebase origin main
          git push
